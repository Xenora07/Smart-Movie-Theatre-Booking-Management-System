# Smart Movie & Theatre Booking Management System
# Spring Boot Configuration

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration using Environment Variables with default fallback placeholders
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_movie_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: MUST BE validate ONLY (never create, update, or drop)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:smartMovieBookingSecureJwtKeyForHmacSha256MustBe32BytesLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
